<div class="aurora" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="grid"></span>
</div>

<div
  class="container-x flex flex-col justify-center gap-7 min-h-[calc(100dvh-4rem)] pt-12 pb-32 sm:py-16 md:py-24"
>
  <p class="eyebrow" data-hero="eyebrow">Available for new work</p>

  <h1
    class="font-display font-semibold text-foreground flex flex-col gap-1 leading-none tracking-tighter text-[clamp(2.5rem,7vw,5.5rem)]"
    data-hero="title"
  >
    <span class="inline-block" data-hero="line">{{ name }}.</span>
    <span class="inline-block text-primary-strong" data-hero="line">
      Senior Full-Stack Developer.
    </span>
    <span class="inline-block text-muted font-medium" data-hero="line">
      Angular front-ends. Spring back-ends.
    </span>
  </h1>

  <p
    class="max-w-[60ch] text-muted text-[clamp(1.05rem,1.4vw,1.2rem)] leading-relaxed"
    data-hero="tag"
  >
    {{ tagline }}
  </p>

  <div
    class="flex flex-wrap gap-x-8 gap-y-5 text-sm text-muted uppercase tracking-wider"
    data-hero="meta"
  >
    <span class="inline-flex items-center gap-2">
      <span class="meta-dot w-2 h-2 rounded-full" aria-hidden="true"></span>
      {{ location }}
    </span>
    <span class="inline-flex items-center gap-2">
      NextGen CARES · Vitality · 5+ years experience
    </span>
  </div>

  <div class="flex flex-wrap gap-3 mt-2" data-hero="actions">
    <a class="btn btn-primary" href="#work">See selected work</a>
    <a class="btn btn-ghost" href="#contact">Get in touch →</a>
    <a
      class="btn btn-ghost gap-2"
      href="/nikoloz-gagua-cv.pdf"
      download="nikoloz-gagua-cv.pdf"
      aria-label="Download CV as PDF"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M5 21h14" />
      </svg>
      Download CV
    </a>
  </div>

  <a
    class="absolute bottom-6 sm:bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2.5 text-xs uppercase tracking-[0.25em] text-muted"
    href="#about"
    aria-label="Scroll to about"
    data-hero="cue"
  >
    <span class="cue-line block w-px h-10" aria-hidden="true"></span>
    <span>Scroll</span>
  </a>
</div>
