<div
  class="container-x flex flex-col items-start justify-between gap-5 md:flex-row md:items-center"
>
  <div class="flex flex-col gap-1.5">
    <p class="text-foreground font-medium">© {{ year }} {{ name }}</p>
    <p class="text-sm" i18n>Built with Angular, GSAP, and a lot of coffee.</p>
  </div>

  <ul class="flex flex-wrap gap-4 list-none m-0 p-0">
    @for (link of socials; track link.label) {
      <li>
        <a
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="link.label"
          class="text-sm text-muted hover:text-primary transition-colors"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</div>
