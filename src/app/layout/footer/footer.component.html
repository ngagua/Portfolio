<div class="container-x footer-inner">
  <div class="footer-meta">
    <p class="footer-name">© {{ year }} {{ name }}</p>
    <p class="footer-credit" i18n>Built with Angular, GSAP, and a lot of coffee.</p>
  </div>

  <ul class="footer-socials">
    @for (link of socials; track link.label) {
      <li>
        <a
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="link.label"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</div>
