<a class="skip-link" href="#main">Skip to content</a>

<div class="container-x flex items-center justify-between gap-6 py-3.5">
  <a
    routerLink="/"
    aria-label="Home"
    (click)="closeMenu()"
    class="inline-flex items-center gap-1.5 font-display font-bold text-base tracking-tight text-foreground"
  >
    <span
      class="monogram inline-grid place-items-center w-8 h-8 rounded-lg text-primary-strong text-sm"
    >
      {{ monogram }}
    </span>
    <span class="w-1.5 h-1.5 rounded-full bg-primary" aria-hidden="true"></span>
  </a>

  <nav class="hidden md:inline-flex gap-8" aria-label="Primary">
    @for (link of links; track link.href) {
      <a
        class="nav-link text-sm text-muted hover:text-foreground transition-colors"
        [class.is-active]="activeId() === link.id"
        [attr.aria-current]="activeId() === link.id ? 'page' : null"
        [href]="link.href"
        (click)="closeMenu()"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="flex items-center gap-3">
    <button
      type="button"
      class="md:hidden inline-flex flex-col items-center justify-center gap-1.5 w-10 h-10 rounded-lg border border-border"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <span class="bar" [class.open]="menuOpen()"></span>
      <span class="bar" [class.open]="menuOpen()"></span>
    </button>
  </div>
</div>

@if (menuOpen()) {
  <nav
    id="mobile-nav"
    class="flex flex-col gap-1 px-5 sm:px-7 md:hidden pt-4 pb-6 bg-background border-b border-border"
    aria-label="Mobile"
  >
    @for (link of links; track link.href) {
      <a
        class="text-lg py-2.5 transition-colors hover:text-primary"
        [class.text-primary]="activeId() === link.id"
        [class.text-foreground]="activeId() !== link.id"
        [attr.aria-current]="activeId() === link.id ? 'page' : null"
        [href]="link.href"
        (click)="closeMenu()"
      >
        {{ link.label }}
      </a>
    }
  </nav>
}
