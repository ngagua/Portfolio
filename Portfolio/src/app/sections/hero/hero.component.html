<div class="aurora" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="grid"></span>
</div>

<div class="container-x hero-content">
  <p class="eyebrow" data-hero="eyebrow" i18n>Available for new work</p>

  <h1 class="hero-title" data-hero="title">
    <span class="hero-line" data-hero="line">{{ name }}.</span>
    <span class="hero-line accent" data-hero="line" i18n>Full-stack engineer.</span>
    <span class="hero-line muted" data-hero="line" i18n>
      Angular front-ends, Spring back-ends.
    </span>
  </h1>

  <p class="hero-tag" data-hero="tag">{{ tagline }}</p>

  <div class="hero-meta" data-hero="meta">
    <span class="meta-item">
      <span class="meta-dot" aria-hidden="true"></span>
      {{ location }}
    </span>
    <span class="meta-item" i18n>3+ years contracting · 12+ years leadership</span>
  </div>

  <div class="hero-actions" data-hero="actions">
    <a class="btn btn-primary" href="#work" i18n>See selected work</a>
    <a class="btn btn-ghost" href="#contact" i18n>Get in touch →</a>
  </div>

  <a class="scroll-cue" href="#about" aria-label="Scroll to about" data-hero="cue">
    <span class="cue-line" aria-hidden="true"></span>
    <span class="cue-text" i18n>Scroll</span>
  </a>
</div>
